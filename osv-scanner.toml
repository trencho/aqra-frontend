# OSV-Scanner configuration. Referenced explicitly by .github/workflows/security-scan.yml
# (`--config=osv-scanner.toml`) rather than relying on per-directory discovery.
#
# Add [[IgnoredVulns]] entries ONLY for a deliberate, documented decision — a reason, and an
# `ignoreUntil` re-review date so an exception cannot quietly become permanent. Never use this to
# silence something that is actually fixable: every other advisory this repo has seen was fixed at
# source instead (most recently brace-expansion, twice, resolved by bumping the `resolutions` pin in
# package.json rather than suppressing it here).

[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
ignoreUntil = 2026-11-15
# `reason` is a real field, not decoration: OSV-Scanner prints it in the scan output next to the
# filtered advisory. Without it the log reads "filtered out because: (no reason given)", which is
# exactly the audit trail this file exists to provide. Keep it populated.
reason = "uuid 7.0.3 (7.5) reaches this repo only via @capacitor/cli (devDependency) -> xcode@3.0.1 -> uuid@^7.0.3. That is iOS build tooling: not imported by src/, not bundled by Vite, absent from the container image, and never invoked in CI. The fix is uuid 11.1.1, four majors outside xcode's ^7.0.3 range, so no lockfile bump reaches it and a resolutions override would need a real iOS build to validate. Waiting on @capacitor/cli to update xcode. Re-review 2026-11-15."
# The long form, so the next reviewer can re-derive the decision rather than trust it:
#
# REACHABILITY. uuid is not a dependency of this app. The only path to it is
#     @capacitor/cli (devDependency)  ->  xcode@3.0.1  ->  uuid@^7.0.3
# @capacitor/cli is iOS/Android build tooling: it manipulates Xcode project files when syncing the
# native shells. It is not imported by src/, is not bundled by Vite, and does not reach the container
# image (docker/Dockerfile builds `yarn build` output into nginx). So the vulnerable code never runs
# in the deployed application, and never runs in CI either — no workflow invokes the Capacitor CLI.
#
# WHY IT CANNOT SIMPLY BE FIXED. The fix is uuid 11.1.1, four majors above xcode's `^7.0.3`
# constraint, so no lockfile bump can reach it. Forcing it would need a `resolutions` override
# pinning uuid 11 inside xcode, which changes an API boundary xcode was never tested against; the
# only way to validate that is a real iOS build, which is not available in CI here.
#
# HOW THIS RESOLVES. Upstream: @capacitor/cli updates its `xcode` dependency (or xcode updates uuid).
# Re-check on the ignoreUntil date, or sooner if a @capacitor/cli release lands:
#     yarn why uuid          # confirm the chain still ends at xcode
#     yarn npm audit         # or re-read the OSV scan output
# When the chain resolves to a patched uuid, DELETE this entry rather than extending the date.
#
# Reviewed 2026-08-15.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-11-02
reason = "braces <= 3.0.3 has no fixed release (3.0.3 is the latest on npm, checked 2026-10-03). It is a dev/build dependency only: sass-embedded (devDependency) -> sass 1.105.0 -> @parcel/watcher 2.5.1 -> micromatch 4.0.8 -> braces 3.0.3 (yarn why braces). It runs in the Sass file watcher at build time and is not bundled into the app or the container image. Re-check on 2026-11-02: if a patched braces exists, run `yarn up -R braces` and delete this entry."
# Reviewed 2026-10-03. Unlike the brace-expansion advisories cleared the same day (a fixed 5.0.12
# exists, so the `resolutions` pin was moved to it), this one has nothing to upgrade to.
