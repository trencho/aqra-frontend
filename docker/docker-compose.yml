services:
  aqra-frontend:
    build:
      args:
        - BUILDKIT_PROGRESS=plain
        - NODE_ENV=${NODE_ENV:-production}
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aqra-frontend
    deploy:
      replicas: 1
    env_file:
      - path: .env
        required: false
    # Matches what CI publishes, so a local `docker compose build` produces an
    # image tagged identically to the deployed one. The deploy no longer uses
    # this file -- it is for local runs only.
    image: ghcr.io/trencho/aqra-frontend:latest
    networks:
      - network
    ports:
      - "8080:80"

networks:
  network:
    attachable: true
    driver: overlay