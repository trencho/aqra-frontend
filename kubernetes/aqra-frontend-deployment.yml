apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: aqra-frontend
  name: aqra-frontend
  namespace: aqra
spec:
  replicas: 1
  selector:
    # Kept as io.kompose.service so this keeps matching the Service selector.
    # A Deployment's selector is immutable, so changing the label key means
    # deleting and recreating the object.
    matchLabels:
      io.kompose.service: aqra-frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/aqra-network: "true"
        io.kompose.service: aqra-frontend
    spec:
      containers:
        - envFrom:
            # Deliberately NOT renamed alongside the workload. This
            # SealedSecret carries no scope annotation, so it uses bitnami's
            # default strict scope and is encrypted against namespace/name
            # (aqra/vue-secret). Renaming it makes it undecryptable and the
            # pod never starts; that would need re-sealing from the plaintext
            # with the cluster's public key.
            #
            # Separately, every key it holds is dead config: none is
            # VITE_-prefixed, so none reaches the browser bundle.
            - secretRef:
                name: vue-secret
          image: ghcr.io/trencho/aqra-frontend:latest
          # Pulled from GHCR, built by the build-and-push job in
          # .github/workflows/build-deploy.yml.
          #
          # This was `image: aqra-frontend` with `imagePullPolicy: Never`,
          # built on the node. That broke silently when the node moved to
          # containerd: `docker build` writes to Docker's image store and
          # kubelet reads containerd's. Every workload in this namespace sat in
          # ErrImageNeverPull for months because of it.
          #
          # Always, not IfNotPresent, because the tag is mutable: reload_pods.sh
          # triggers a rollout restart, and without Always a node holding an
          # older :latest would happily reuse it and the deploy would be a
          # no-op. The commit-SHA tag pushed alongside :latest is what to pin
          # here if an immutable reference is ever wanted.
          imagePullPolicy: Always
          name: aqra-frontend
          ports:
            - containerPort: 80
          # Readiness gates traffic, liveness restarts a wedged container.
          # Only liveness existed, so the Service could route to a pod that was
          # not yet serving. The old liveness settings were also extreme --
          # failureThreshold 1 with a 60s timeout meant one slow response
          # restarted the pod.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          # Was `resources: {}`, which makes the pod BestEffort: first evicted
          # under node pressure, and free to starve its neighbours. Sized for
          # an nginx container serving static files.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # Dropping ALL alone makes nginx fail to start:
              #
              #   [emerg] chown("/var/cache/nginx/client_temp", 101) failed
              #           (1: Operation not permitted)
              #
              # docker/nginx.conf sets `user nginx`, so the master process --
              # which runs as root -- chowns its temp directories to uid 101 at
              # startup and forks workers as that user. Dropping ALL takes
              # CAP_CHOWN away, and also strips root's ability to bind a port
              # below 1024, so the listen on :80 would fail next.
              #
              # These four are the minimum that startup path needs. Nothing is
              # added speculatively: each was traced to a specific syscall.
              #
              # This could not have been caught before 2026-07-31. The node
              # could never pull this image -- it sat in ErrImageNeverPull for
              # months because the build wrote to Docker's store while kubelet
              # read containerd's -- so the securityContext had never once been
              # exercised. The first successful pull was the first real test.
              add:
                - CHOWN
                - SETUID
                - SETGID
                - NET_BIND_SERVICE
