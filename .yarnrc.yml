# Install into node_modules rather than Yarn's default Plug'n'Play resolution.
# Vue CLI / webpack 5 and the Capacitor CLI both resolve modules from disk and
# do not work under PnP.
nodeLinker: node-modules

# --- written by `yarn install`'s migration off the Yarn 1 lockfile ---
# These three preserve the permissive Yarn 1 behaviour the project already had.

# Allow packages to run install scripts (node-sass/sass-embedded, @parcel/watcher
# and yorkie all need this).
enableScripts: true

approvedGitRepositories:
  - "**"

# Refuse packages published less than three days ago -- the window in which a
# compromised release is typically caught and unpublished. Yarn's migration off
# the Yarn 1 lockfile set this to 0, disabling the defence entirely.
#
# Three days rather than a week because Dependabot now auto-merges patch and
# minor bumps: the gate makes `yarn install --immutable` fail in CI for any
# release younger than this, so too long a window turns routine bumps red.
# Dependabot runs weekly, so most releases it proposes are already past it.
npmMinimalAgeGate: 4320
