# Install into node_modules rather than Yarn's default Plug'n'Play resolution.
# Vue CLI / webpack 5 and the Capacitor CLI both resolve modules from disk and
# do not work under PnP.
nodeLinker: node-modules

# --- written by `yarn install`'s migration off the Yarn 1 lockfile ---
# These three preserve the permissive Yarn 1 behaviour the project already had.

# Allow packages to run install scripts (node-sass/sass-embedded, @parcel/watcher
# and yorkie all need this).
enableScripts: true

approvedGitRepositories:
  - "**"

# Yarn 4.18 will otherwise refuse packages published less than a few days ago, as
# a defence against a compromised release being pulled in immediately. Migration
# sets this to 0 to match Yarn 1. Worth raising once CI exists — see the tooling
# audit.
npmMinimalAgeGate: 0
