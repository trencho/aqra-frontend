# Dependabot re-reads this file on every change to it, and queues a fresh set of
# update jobs. That is deliberate here: ten update jobs sat `queued` and never
# started while the repository was private, so this edit doubles as the trigger
# that re-runs them now that it is public.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    # The project pins every dependency exactly (no ^ or ~), so Dependabot
    # must rewrite the manifest rather than rely on a range.
    versioning-strategy: increase
    groups:
      # One PR for the routine bumps; majors stay separate so each gets its
      # own review.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the native-compiler rewrite, and it is blocked upstream rather than deferred
      # by preference: typescript-eslint peers `typescript >=4.8.4 <6.1.0`, so no released version
      # supports TS 7, and Yarn's builtin typescript compat patch is incompatible with the native
      # compiler. PR #20 sat open and red on exactly this for ten days (CI failed with
      # ERR_INTERNAL_ASSERTION), and a permanently-red PR is noise that hides a real failure.
      #
      # Lift this when typescript-eslint ships TS 7 support -- and move the toolchain together
      # (typescript, typescript-eslint, vue-tsc), not this pin alone. Matches how
      # crowd-tune-frontend and trencho.github.io hold the same major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
        # lift-when: npm-peer typescript-eslint allows typescript >=7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Skopje

  # docker/Dockerfile pins node:24-alpine3.24 and nginx:stable-alpine3.24 to an
  # explicit Alpine release. Nothing else updates them, so base-image CVEs would
  # have gone unnoticed.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    ignore:
      # Hold Node majors. CI pins node-version 24 and engines.node is ">=24",
      # so taking a major here alone would build and ship production on a
      # runtime nothing tests against. Node 26 does not become LTS until
      # 2026-10-28. Lift this when moving the whole project to the next LTS --
      # CI, engines.node, .nvmrc and this base image together, not piecemeal.
      - dependency-name: node
        update-types:
          - version-update:semver-major
        # lift-when: eol-lts nodejs 26

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly

  # Compose files -- a SEPARATE ecosystem from `docker`, which does NOT cover them. Before this
  # block existed the image tags in /docker were updated by nothing at all, because
  # `docker` was configured and containers read as handled.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
