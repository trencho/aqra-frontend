name: Deploy AQRA frontend

# Gated on CI rather than firing on every push. Previously any push to master
# went straight to production with nothing having built, linted or tested it --
# a broken build was discovered by the server rebuilding it.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  # Manual escape hatch, e.g. to redeploy an unchanged commit.
  workflow_dispatch:

env:
  OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
  OPENVPN_USERNAME: ${{ secrets.OPENVPN_USERNAME }}
  OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
  CA_CERT: ${{ secrets.CA_CERT }}
  CLIENT_CERT: ${{ secrets.CLIENT_CERT }}
  TLS_CRYPT_KEY: ${{ secrets.TLS_CRYPT_KEY }}
  USER_KEY: ${{ secrets.USER_KEY }}
  SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
  GIT_REPO_PATH: ${{ secrets.GIT_REPO_PATH }}
  GIT_REPO_USERNAME: ${{ secrets.GIT_REPO_USERNAME }}
  GIT_REPO_NAME: ${{ secrets.GIT_REPO_NAME }}

permissions:
  contents: read

# Two quick pushes previously raced on the same server directory, both running
# git reset --hard and rebuilding concurrently. Deploys now queue instead, and
# an in-flight one is never cancelled half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The image is built HERE, on the runner, and pushed to GHCR -- not on the
  # deploy host.
  #
  # It used to be built on the node with `docker compose build` and consumed
  # with `imagePullPolicy: Never`. That silently stopped working when the node
  # moved to containerd: `docker build` writes to Docker's image store, kubelet
  # reads containerd's, and the two are separate. Every workload on that node
  # sat in ErrImageNeverPull for months as a result, with `docker images`
  # cheerfully listing images the cluster could not see.
  #
  # Building here and pulling from a registry removes the whole class of
  # problem: there is no node-local image store to go stale, and a prune, an
  # image GC or another runtime switch can no longer strand the deployment.
  # The node does not need Docker at all any more.
  build-and-push:
    name: Build and push the image
    runs-on: ubuntu-latest
    # workflow_run fires on failure too, so the conclusion must be checked
    # explicitly or a red CI run would still deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      # Required to push to GHCR. Deliberately scoped to this job rather than
      # granted workflow-wide.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: :latest for the Deployment to track, and the commit SHA so a
      # specific build can be identified and rolled back to.
      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: NODE_ENV=production
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    # Nothing is deployed unless an image was actually published.
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # OPENVPN_CONFIG holds a *path*, and it is a secret, so when the file is
      # missing the VPN action reports `config file '***' not found` -- masked,
      # and therefore impossible to act on. That is exactly what happened after
      # commit 09a61db deleted .github/workflows/client.ovpn as "unreferenced":
      # the only reference lived in the secret, so grep found nothing.
      #
      # Fail here instead, before the two-minute apt install, and say which file
      # this repository actually ships.
      - name: Verify the OpenVPN config file exists
        env:
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
        run: |
          if [ ! -f "${OPENVPN_CONFIG}" ]; then
            echo "::error::OPENVPN_CONFIG names a file that is not in the checkout."
            echo "The secret must hold a path, relative to the repository root, to an"
            echo "OpenVPN config. This repository ships one at:"
            echo "    .github/workflows/client.ovpn"
            echo "Present in .github/workflows right now:"
            ls -A .github/workflows
            exit 1
          fi

      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      # Written from secrets rather than committed, and referenced by absolute
      # path from client.ovpn. Passed through `env:` rather than interpolated
      # into the script body with ${{ }}: expression interpolation splices the
      # value into the shell source before it runs, which is a script-injection
      # surface and mangles anything the shell would treat as syntax.
      - name: Create necessary OpenVPN key files
        env:
          CA_CERT: ${{ secrets.CA_CERT }}
          CLIENT_CERT: ${{ secrets.CLIENT_CERT }}
          TLS_CRYPT_KEY: ${{ secrets.TLS_CRYPT_KEY }}
        run: |
          sudo mkdir -p /etc/openvpn
          printf '%s\n' "${CA_CERT}" | sudo tee /etc/openvpn/ca.crt > /dev/null
          printf '%s\n' "${CLIENT_CERT}" | sudo tee /etc/openvpn/client.crt > /dev/null
          printf '%s\n' "${TLS_CRYPT_KEY}" | sudo tee /etc/openvpn/tls-crypt.key > /dev/null

      # Emits a Node 20 deprecation warning: the action declares
      # `using: node20` and GitHub now force-runs it on Node 24. v3.1.0 is the
      # latest release (June 2024) and still declares node20, so there is
      # nothing to bump to -- this is upstream and cannot be fixed here. The
      # forced runtime works; the warning is cosmetic until GitHub drops the
      # shim, at which point this needs replacing rather than upgrading.
      - name: Connect to VPN
        uses: kota65535/github-openvpn-connect-action@v3.1.0
        with:
          config_file: ${{ env.OPENVPN_CONFIG }}
          echo_config: false
          username: ${{ env.OPENVPN_USERNAME }}
          password: ${{ env.OPENVPN_PASSWORD }}
          client_key: ${{ env.USER_KEY }}

      - name: SSH commands for checkout/update git repo, build and deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            set -e # Stop execution on any error

            echo "Setting up environment variables..."
            export ACCESS_TOKEN=${{ env.ACCESS_TOKEN }}
            export GIT_REPO_NAME=${{ env.GIT_REPO_NAME }}
            export GIT_REPO_PATH=${{ env.GIT_REPO_PATH }}
            export GIT_REPO_USERNAME=${{ env.GIT_REPO_USERNAME }}
            export SSH_USERNAME=${{ env.SSH_USERNAME }}

            echo "Cloning/Updating repository..."
            mkdir -p "${GIT_REPO_PATH}"

            if [ ! -d "${GIT_REPO_PATH}/.git" ]; then
              echo "Repository not found. Cloning..."
              git clone https://"${ACCESS_TOKEN}"@github.com/"${GIT_REPO_USERNAME}"/"${GIT_REPO_NAME}".git "${GIT_REPO_PATH}"
              cd "${GIT_REPO_PATH}" || exit
            else
              echo "Repository found. Fetching latest changes..."
              cd "${GIT_REPO_PATH}" || exit
              git fetch origin
              git reset --hard origin/master
            fi

            echo "Setting correct ownership..."
            chown -R "${SSH_USERNAME}:${SSH_USERNAME}" "${GIT_REPO_PATH}"

            echo "Making scripts executable..."
            find .github/workflows -type f -name "*.sh" -exec chmod +x {} +

            echo "Executing deployment scripts..."
            # No build step here any more -- the image was built and pushed by
            # the build-and-push job above, and the node pulls it from GHCR.
            .github/workflows/deploy_kubernetes_resources.sh

            echo "Restarting Kubernetes Deployments..."
            .github/workflows/reload_pods.sh

            echo "Deployment successful!"