name: Deploy AQRA frontend

# Gated on CI rather than firing on every push. Previously any push to master
# went straight to production with nothing having built, linted or tested it --
# a broken build was discovered by the server rebuilding it.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  # Manual escape hatch, e.g. to redeploy an unchanged commit.
  workflow_dispatch:

permissions:
  contents: read

# Two quick pushes previously raced on the same server directory, both running
# git reset --hard and rebuilding concurrently. Deploys now queue instead, and
# an in-flight one is never cancelled half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The image is built HERE, on the runner, and pushed to GHCR -- not on the
  # deploy host.
  #
  # It used to be built on the node with `docker compose build` and consumed
  # with `imagePullPolicy: Never`. That silently stopped working when the node
  # moved to containerd: `docker build` writes to Docker's image store, kubelet
  # reads containerd's, and the two are separate. Every workload on that node
  # sat in ErrImageNeverPull for months as a result, with `docker images`
  # cheerfully listing images the cluster could not see.
  #
  # Building here and pulling from a registry removes the whole class of
  # problem: there is no node-local image store to go stale, and a prune, an
  # image GC or another runtime switch can no longer strand the deployment.
  # The node does not need Docker at all any more.
  build-and-push:
    name: Build and push the image
    runs-on: ubuntu-latest
    # workflow_run fires on failure too, so the conclusion must be checked
    # explicitly or a red CI run would still deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      # Required to push to GHCR. Deliberately scoped to this job rather than
      # granted workflow-wide.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: :latest for the Deployment to track, and the commit SHA so a
      # specific build can be identified and rolled back to.
      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: NODE_ENV=production
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    # Nothing is deployed unless an image was actually published.
    needs: build-and-push

    # A backstop against a hung runner, not a second deadline competing with the rollout.
    # Successful deploys here take 1-2.5 minutes; the bound that matters is the failure
    # case. Neither deploy_kubernetes_resources.sh nor reload_pods.sh passes --timeout to
    # `kubectl rollout status`, so each waits until Kubernetes itself gives up -- the
    # default progressDeadlineSeconds of 10 minutes, and this deployment does not override
    # it. Two such waits plus the VPN and SSH setup is the honest worst case, so 30 leaves
    # room without ever truncating a deploy that would have succeeded.
    #
    # Without this the default is 6 hours, and because this job holds the deploy-production
    # concurrency group, a stuck step queues every later deploy behind it for that whole
    # time. Sibling change: air-quality-rest-api#56.
    timeout-minutes: 30

    # Scoped to this job, not the workflow.
    #
    # These 14 are the production deploy credentials -- an SSH private key, the full OpenVPN
    # credential set, and a repo access token. Declared at workflow level they were injected into
    # the environment of every job, so `build-and-push` ran with all of them while needing only
    # GITHUB_TOKEN for GHCR, alongside four third-party actions. Every consumer of every one of
    # these is a step of this job.
    #
    # The step-level `env:` blocks further down (the OpenVPN config path and the three key files)
    # stay as they are -- they exist for a different reason, explained where they sit.
    env:
      OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
      OPENVPN_USERNAME: ${{ secrets.OPENVPN_USERNAME }}
      OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
      CA_CERT: ${{ secrets.CA_CERT }}
      CLIENT_CERT: ${{ secrets.CLIENT_CERT }}
      TLS_CRYPT_KEY: ${{ secrets.TLS_CRYPT_KEY }}
      USER_KEY: ${{ secrets.USER_KEY }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      GIT_REPO_PATH: ${{ secrets.GIT_REPO_PATH }}
      GIT_REPO_USERNAME: ${{ secrets.GIT_REPO_USERNAME }}
      GIT_REPO_NAME: ${{ secrets.GIT_REPO_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # OPENVPN_CONFIG holds a *path*, and it is a secret, so when the file is
      # missing the VPN action reports `config file '***' not found` -- masked,
      # and therefore impossible to act on. That is exactly what happened after
      # commit 09a61db deleted .github/workflows/client.ovpn as "unreferenced":
      # the only reference lived in the secret, so grep found nothing.
      #
      # Fail here instead, before the two-minute apt install, and say which file
      # this repository actually ships.
      - name: Verify the OpenVPN config file exists
        env:
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
        run: |
          if [ ! -f "${OPENVPN_CONFIG}" ]; then
            echo "::error::OPENVPN_CONFIG names a file that is not in the checkout."
            echo "The secret must hold a path, relative to the repository root, to an"
            echo "OpenVPN config. This repository ships one at:"
            echo "    .github/workflows/client.ovpn"
            echo "Present in .github/workflows right now:"
            ls -A .github/workflows
            exit 1
          fi

      # Cache the .debs so a degraded Ubuntu mirror cannot stall the deploy. GitHub's cache
      # service is a different network path from the mirror, so a HIT bypasses apt entirely --
      # which is the whole point, after this step stalled 18 minutes three times on 2026-08-19.
      # A MISS still goes to apt, so the retry loop below stays exactly as it was.
      #
      # The key carries the runner image build because the dependency closure differs per image
      # and a .deb set restored against a different one can half-install; and the package list,
      # so changing what is installed invalidates it. Deliberately NO restore-keys: a prefix
      # near-miss would restore a set built for another image, which is the failure this key
      # exists to prevent.
      - name: Restore the OpenVPN packages
        uses: actions/cache@v6
        with:
          path: .aptcache
          key: apt-openvpn-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}

      - name: Install OpenVPN
        # Required, not incidental: the connect action below installs nothing -- it writes
        # the config and keys and runs `sudo openvpn` -- and openvpn is not on the runner
        # image. This came from that action's own README.
        #
        # openvpn-systemd-resolved is NOT installed any more. It only does anything when the
        # config invokes its script via an `up` directive, and client.ovpn has no `up`/`down`
        # and no `script-security` -- without which OpenVPN refuses to run such a script at
        # all. It has never been doing anything here.
        #
        # Each apt call is bounded individually so a stall is KILLED and retried rather than
        # hanging silently. `sudo timeout` rather than `timeout sudo`, so the signal reaches
        # apt-get itself instead of the sudo wrapper it would otherwise stop at.
        # timeout-minutes is only a backstop for the loop as a whole.
        timeout-minutes: 10
        run: |
          set -u
          echo "runner image: ImageOS=${ImageOS:-<unset>} ImageVersion=${ImageVersion:-<unset>}"

          # Cache hit: install from the .debs without touching the network at all.
          if ls .aptcache/*.deb >/dev/null 2>&1; then
            if sudo dpkg -i .aptcache/*.deb; then
              echo "OpenVPN installed from cache: $(openvpn --version | head -1)"
              exit 0
            fi
            echo "::warning::cached .debs did not install (runner image probably changed); falling back to apt"
          fi

          # Miss: download into the cached dir so the next run hits. Dir::Cache::archives is
          # repo-local because /var/cache/apt/archives is root-owned and actions/cache saves
          # as `runner`; the chown below is why the post-step can read what apt wrote.
          mkdir -p .aptcache/partial
          install_openvpn() {
            sudo timeout 60 apt-get update -o Acquire::Retries=3 \
              && sudo timeout 90 apt-get install -y --no-install-recommends \
                   -o Acquire::Retries=3 -o Dir::Cache::archives="$(pwd)/.aptcache" openvpn
          }
          for attempt in 1 2 3; do
            if install_openvpn; then
              sudo chown -R "$(id -u):$(id -g)" .aptcache
              echo "OpenVPN installed on attempt ${attempt}: $(openvpn --version | head -1)"
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} did not finish within its budget; retrying"
            sleep 10
          done
          echo "::error::could not install OpenVPN after 3 attempts"
          exit 1

      # Written from secrets rather than committed, and referenced by absolute
      # path from client.ovpn. Passed through `env:` rather than interpolated
      # into the script body with ${{ }}: expression interpolation splices the
      # value into the shell source before it runs, which is a script-injection
      # surface and mangles anything the shell would treat as syntax.
      - name: Create necessary OpenVPN key files
        env:
          CA_CERT: ${{ secrets.CA_CERT }}
          CLIENT_CERT: ${{ secrets.CLIENT_CERT }}
          TLS_CRYPT_KEY: ${{ secrets.TLS_CRYPT_KEY }}
        run: |
          sudo mkdir -p /etc/openvpn
          printf '%s\n' "${CA_CERT}" | sudo tee /etc/openvpn/ca.crt > /dev/null
          printf '%s\n' "${CLIENT_CERT}" | sudo tee /etc/openvpn/client.crt > /dev/null
          printf '%s\n' "${TLS_CRYPT_KEY}" | sudo tee /etc/openvpn/tls-crypt.key > /dev/null

      # Emits a Node 20 deprecation warning: the action declares
      # `using: node20` and GitHub now force-runs it on Node 24. v3.1.0 is the
      # latest release (June 2024) and still declares node20, so there is
      # nothing to bump to -- this is upstream and cannot be fixed here. The
      # forced runtime works; the warning is cosmetic until GitHub drops the
      # shim, at which point this needs replacing rather than upgrading.
      - name: Connect to VPN
        uses: kota65535/github-openvpn-connect-action@v3.1.0
        with:
          config_file: ${{ env.OPENVPN_CONFIG }}
          echo_config: false
          username: ${{ env.OPENVPN_USERNAME }}
          password: ${{ env.OPENVPN_PASSWORD }}
          client_key: ${{ env.USER_KEY }}

      - name: Record the deploy start time
        id: deploy_started
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: SSH commands for checkout/update git repo, build and deploy
        id: remote_deploy
        # Failure is handled below instead of here, so that a retry can be decided on.
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          # The script is a file so the retry below points at it rather than carrying a
          # second copy of it, and envs forwards the values it needs -- which also stops
          # five secrets being interpolated into the script text.
          envs: ACCESS_TOKEN,GIT_REPO_NAME,GIT_REPO_PATH,GIT_REPO_USERNAME,SSH_USERNAME
          script_path: .github/workflows/remote_deploy.sh

      - name: Decide whether the failure is worth retrying
        id: retry_decision
        if: steps.remote_deploy.outcome == 'failure'
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.deploy_started.outputs.epoch }} ))
          # appleboy/ssh-action downloads its drone-ssh binary from a GitHub release at
          # run time. When that download fails the step dies in about twenty seconds
          # having never opened a session -- that happened on 2026-08-19 and is free to
          # retry. A deploy that genuinely failed is minutes in, because it waits on
          # `kubectl rollout status`; retrying that just runs a doomed deploy twice.
          if [ "${elapsed}" -lt 120 ]; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "::warning::remote deploy failed after ${elapsed}s -- too early to have reached the deploy itself, retrying once"
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "::error::remote deploy failed after ${elapsed}s -- far enough in to be a real failure, not retrying"
          fi

      - name: SSH commands for checkout/update git repo, build and deploy (retry)
        if: steps.retry_decision.outputs.retry == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          envs: ACCESS_TOKEN,GIT_REPO_NAME,GIT_REPO_PATH,GIT_REPO_USERNAME,SSH_USERNAME
          script_path: .github/workflows/remote_deploy.sh

      - name: Fail the job when the deploy failed and was not retried
        if: steps.remote_deploy.outcome == 'failure' && steps.retry_decision.outputs.retry != 'true'
        run: exit 1
