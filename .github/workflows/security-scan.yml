name: Security scan

on:
  # No `push`. A push to master is a squash of the tree the `pull_request` run checked minutes
  # earlier, and these jobs upload no SARIF, so a master run re-answers a question already answered.
  # The gap that accepts: a dependency change pushed straight to master, bypassing a PR, waits for the
  # weekly run. Dependencies here arrive through Dependabot PRs, and Dependabot's alerts cover that.
  #
  # `pull_request` runs only when something the scan READS changes: the manifest, the lock, Yarn's
  # config, OSV's config, or this file. Any other PR would re-scan the tree master already has,
  # which the weekly schedule covers.
  pull_request:
    paths:
      - package.json
      - yarn.lock
      - .yarnrc.yml
      - osv-scanner.toml
      - .github/workflows/security-scan.yml
  workflow_dispatch:
  schedule:
    # Weekly, so a newly published advisory against an unchanged lockfile is
    # still found. A push-only scan goes quiet exactly when a project is stable.
    - cron: "09 7 * * 1" # weekly, Monday 07:09 UTC - fleet slot (minutes staggered per repo)

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # --config is passed explicitly rather than relying on per-directory discovery, so the
      # accepted-advisory list is unambiguously in effect. osv-scanner.toml documents each entry
      # with a reason and an ignoreUntil re-review date; it is never used to silence a fixable
      # advisory.
      - name: Scan the lockfile
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=./yarn.lock

  audit:
    name: Yarn audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Must precede setup-node: its `cache: yarn` runs `yarn cache dir`, and
      # the runner's global yarn 1.x refuses to run against a packageManager
      # field pinning 4.x.
      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Fails on moderate and above. The project reached zero advisories in the
      # Vue 3 migration; this keeps it there.
      - name: Audit
        run: yarn npm audit --severity moderate
