name: Security scan

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # Weekly, so a newly published advisory against an unchanged lockfile is
    # still found. A push-only scan goes quiet exactly when a project is stable.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # --config is passed explicitly rather than relying on per-directory discovery, so the
      # accepted-advisory list is unambiguously in effect. osv-scanner.toml documents each entry
      # with a reason and an ignoreUntil re-review date; it is never used to silence a fixable
      # advisory.
      - name: Scan the lockfile
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=./yarn.lock

  audit:
    name: Yarn audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Must precede setup-node: its `cache: yarn` runs `yarn cache dir`, and
      # the runner's global yarn 1.x refuses to run against a packageManager
      # field pinning 4.x.
      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Fails on moderate and above. The project reached zero advisories in the
      # Vue 3 migration; this keeps it there.
      - name: Audit
        run: yarn npm audit --severity moderate
