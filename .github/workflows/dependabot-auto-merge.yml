name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge patch and minor updates
    runs-on: ubuntu-latest
    # Gate on the PR's author, not on github.actor. github.actor is whoever
    # triggered the run, so it flips to a human's name the moment anyone
    # pushes to or reruns the branch -- and the job then silently stops
    # gating anything. The PR author is stable for the life of the PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Read the update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Majors are deliberately excluded: they need a human to read the
      # changelog. This project has already been bitten by that -- ESLint 9 ->
      # 10 broke the lint run outright via an incompatible parser scope
      # manager, and Vuetify 2 -> 4 rewrote most of the component API.
      #
      # `gh pr merge --auto` queues the merge; it lands only once every
      # required check passes. That gate is real only because master carries a
      # ruleset requiring CI's "Lint, test and build" job -- without required
      # checks, --auto merges immediately and gates nothing. The security scan
      # is deliberately NOT required: a newly published advisory against an
      # unchanged lockfile would otherwise block every routine bump.
      #
      # Auto-merge also needs `allow_auto_merge` on the repo, which is only
      # available on public or Pro repos. This workflow existed for a day
      # against a free private repo, where the step could not have worked.
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type ==
            'version-update:semver-patch' ||
          steps.metadata.outputs.update-type ==
            'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave a note on a major update
        if: >-
          steps.metadata.outputs.update-type ==
          'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump — not auto-merged. Needs a human to read the changelog."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
