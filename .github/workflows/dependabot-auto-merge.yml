name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge patch and minor updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Read the update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Majors are deliberately excluded: they need a human to read the
      # changelog. This project has already been bitten by that -- ESLint 9 ->
      # 10 broke the lint run outright via an incompatible parser scope
      # manager, and Vuetify 2 -> 4 rewrote most of the component API.
      #
      # `gh pr merge --auto` queues the merge; it lands only once every
      # required check passes. Since master deploys to production after CI,
      # nothing merges here that has not built, linted and tested green.
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type ==
            'version-update:semver-patch' ||
          steps.metadata.outputs.update-type ==
            'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave a note on a major update
        if: >-
          steps.metadata.outputs.update-type ==
          'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump — not auto-merged. Needs a human to read the changelog."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
